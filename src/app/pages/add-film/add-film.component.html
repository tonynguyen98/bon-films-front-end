<section class="page-shell py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm rounded-4 overflow-hidden">
          <div class="card-header p-4 bg-dark bg-opacity-10">
            <h3 class="mb-1">Add a New Film</h3>
            <p class="text-muted mb-0">Create a film entry so others can review it.</p>
          </div>
          <div class="card-body p-4">
            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Title</label>
                  <input class="form-control" formControlName="title" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Genre</label>
                  <input class="form-control" formControlName="genre" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Studio</label>
                  <input class="form-control" formControlName="studio" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Director</label>
                  <input class="form-control" formControlName="director" />
                </div>
                <div class="col-12">
                  <label class="form-label">Top Billing</label>
                  <input class="form-control" formControlName="topBilling" />
                </div>
                <div class="col-12">
                  <label class="form-label">Synopsis</label>
                  <textarea class="form-control" rows="5" formControlName="synopsis"></textarea>
                </div>
              </div>
              <div *ngIf="error" class="alert alert-danger mt-4">{{ error }}</div>
              <button class="btn btn-primary mt-4" [disabled]="loading">{{ loading ? 'Saving…' : 'Add Film' }}</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

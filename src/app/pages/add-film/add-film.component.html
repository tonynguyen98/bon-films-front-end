<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4">Add Film</h3>
            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Title</label>
                  <input class="form-control" formControlName="title" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Genre</label>
                  <input class="form-control" formControlName="genre" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Studio</label>
                  <input class="form-control" formControlName="studio" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Director</label>
                  <input class="form-control" formControlName="director" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Top Billing</label>
                  <input class="form-control" formControlName="topBilling" />
                </div>
                <div class="col-md-12">
                  <label class="form-label">Synopsis</label>
                  <textarea class="form-control" rows="5" formControlName="synopsis"></textarea>
                </div>
              </div>
              <div *ngIf="error" class="alert alert-danger mt-4">{{ error }}</div>
              <button class="btn btn-primary mt-4" [disabled]="loading">{{ loading ? 'Saving…' : 'Add Film' }}</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

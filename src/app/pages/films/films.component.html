<section class="page-shell py-5">
  <div class="container">
    <div class="section-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
      <div>
        <h2>Films</h2>
        <p class="text-muted">Browse the latest titles, jump into reviews, or add a new film.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-success" routerLink="/add-film">Add Film</a>
        <a class="btn btn-outline-primary" routerLink="/create-review">Add Review</a>
        <button class="btn btn-secondary" (click)="loadFilms()">Refresh</button>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div class="row g-4">
      <div class="col-xl-4 col-lg-6" *ngFor="let film of films">
        <article class="film-card h-100 rounded-4 shadow-sm overflow-hidden">
          <div class="film-cover p-4">
            <div class="cover-label">{{ film.genre || 'Genre' }}</div>
            <h5 class="film-title mt-3">{{ film.title }}</h5>
            <p class="film-subtitle text-muted">Directed by {{ film.director || 'Unknown' }}</p>
          </div>
          <div class="card-body d-flex flex-column bg-dark bg-opacity-5">
            <p class="card-text text-truncate">{{ film.synopsis }}</p>
            <div class="mt-auto pt-3">
              <a class="btn btn-sm btn-outline-light" [routerLink]="['/film', film.id]">View details</a>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>

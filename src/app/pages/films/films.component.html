<section class="py-5">
  <div class="container">
    <div
      class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
      <div>
        <h2>Films</h2>
        <p class="text-muted">Browse the available films and view reviews.</p>
      </div>
      <div class="btn-toolbar gap-2">
        <a class="btn btn-success" routerLink="/add-film">Add Film</a>
        <a class="btn btn-outline-primary" routerLink="/create-review">Add Review</a>
        <button class="btn btn-secondary" (click)="loadFilms()">Refresh</button>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let film of films">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ film.title }}</h5>
            <p class="card-text text-truncate">{{ film.synopsis }}</p>
            <div class="mt-auto">
              <p class="mb-1"><strong>Genre:</strong> {{ film.genre }}</p>
              <p class="mb-3"><strong>Director:</strong> {{ film.director }}</p>
              <a class="btn btn-primary" [routerLink]="['/film', film.id]">View reviews</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

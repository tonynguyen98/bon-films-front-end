<section class="page-shell py-5">
  <div class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
      <div>
        <h2>My Reviews</h2>
        <p class="text-muted">Track your contributions and revisit past reviews.</p>
      </div>
      <a class="btn btn-primary" routerLink="/create-review">Write a new review</a>
    </div>
    <div *ngIf="loading" class="text-center py-4"><div class="spinner-border text-primary"></div></div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="!loading && reviews.length === 0" class="alert alert-secondary">No reviews found.</div>
    <div class="row g-4">
      <div class="col-md-6" *ngFor="let review of reviews">
        <a [routerLink]="['/review', review.id]" class="review-summary-card rounded-4 p-4 d-block text-decoration-none">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
              <h5 class="mb-1">{{ review.film?.title || 'Film review' }}</h5>
              <p class="text-muted small mb-0">{{ review.dateReviewed | date:'mediumDate' }}</p>
            </div>
            <span class="badge bg-primary">{{ review.rating }}/5</span>
          </div>
          <p class="text-muted mb-0 text-truncate">{{ review.review }}</p>
        </a>
      </div>
    </div>
  </div>
</section>
